  - generic [ref=f2e28]:
    - heading "PENGEMBANGAN GAME STORYTELLING UNTUK MEMBERIKAN WAWASAN LITERASI KEUANGAN" [level=1] [ref=f2e29]
    - generic [ref=f2e31]:
      - paragraph [ref=f2e32]:
        - text: Achmad Fauzan, - and Rosa Ariani Sukamto, - and Yudi Ahmad Hambali, - (2026)
        - emphasis [ref=f2e33]: PENGEMBANGAN GAME STORYTELLING UNTUK MEMBERIKAN WAWASAN LITERASI KEUANGAN.
        - text: S1 thesis, Universitas Pendidikan Indonesia.
      - heading "Abstract" [level=2] [ref=f2e34]
      - paragraph [ref=f2e35]: Rendahnya tingkat literasi keuangan di Indonesia menjadi tantangan serius yang membuat masyarakat, khususnya generasi muda, rentan terhadap keputusan finansial yang buruk. Media konvensional seringkali kurang menarik dan efektif. Penelitian ini bertujuan untuk mengembangkan dan mengevaluasi efektivitas game storytelling berjudul "Dried Sandwich" sebagai media alternatif untuk memberikan wawasan literasi keuangan. Penelitian ini menggunakan metode pengembangan Game Development Life Cycle (GDLC) dan diuji kepada 30 responden. Proses evaluasi dilakukan secara kuantitatif menggunakan kuesioner GUESS-18 untuk mengukur pengalaman pengguna (user experience) dan kuesioner wawasan literasi keuangan. Hasil penelitian menunjukkan bahwa game "Dried Sandwich" sangat berhasil. Dari sisi pengalaman pengguna, game mendapatkan skor rata-rata GUESS-18 sebesar 85.87%, dengan aspek Naratif (93.57%) dan Estetika Visual (92.85%) menjadi yang paling unggul. Dari sisi dampak wawasan literasi keuangan, game terbukti efektif dengan Tingkat Capaian Rata-rata (TCR) sebesar 89.33%, di mana dampak terbesar terlihat pada pembentukan Sikap Keuangan (90.6%) dan kesadaran Perilaku Keuangan (90%). Hal ini mengindikasikan bahwa game storytelling merupakan media yang sangat menjanjikan, efektif, dan menyenangkan untuk edukasi keuangan.; The low level of financial literacy in Indonesia poses a serious challenge, making the public, especially the younger generation, vulnerable to poor financial decisions. Conventional media are often less engaging and effective. This study aims to develop and evaluate the effectiveness of a storytelling game titled "Dried Sandwich" as an alternative medium for providing financial literacy insights. This research utilized the Game Development Life Cycle (GDLC) method and was tested on 30 respondents. The evaluation process was conducted quantitatively using the GUESS-18 questionnaire to measure user experience and a financial literacy awareness questionnaire. The results show that the "Dried Sandwich" game was highly successful. In terms of user experience, the game achieved an average GUESS-18 score of 85.87%, with the Narrative (93.57%) and Visual Aesthetics (92.85%) aspects being the most outstanding. In terms of financial literacy insight, the game proved effective with a total Average Achievement Rate of 89.33%, where the greatest impact was seen in shaping Financial Attitude (90.6%) and Financial Behaviour awareness (90%). This indicates that a storytelling game is a highly promising, effective, and enjoyable medium for financial education.
